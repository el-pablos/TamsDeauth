<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
<rect width="500" height="400" fill="#1a1a2e" rx="12"/>
<text x="250" y="30" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="16" font-weight="bold">VIRTUAL DISPLAY</text>
<rect x="30" y="50" width="440" height="330" fill="#16213e" rx="8"/>
<!-- OLED canvas -->
<rect x="170" y="70" width="160" height="100" fill="#000" rx="2" stroke="#00b4ff" stroke-width="1"/>
<text x="180" y="88" fill="#00b4ff" font-family="monospace" font-size="7" font-weight="bold">MAIN MENU</text>
<text x="180" y="100" fill="#fff" font-family="monospace" font-size="6">&gt; Scan Network</text>
<text x="180" y="110" fill="#666" font-family="monospace" font-size="6">  Select Network</text>
<text x="180" y="120" fill="#666" font-family="monospace" font-size="6">  Station</text>
<text x="180" y="130" fill="#666" font-family="monospace" font-size="6">  Target</text>
<!-- glow effect indicator -->
<text x="250" y="55" text-anchor="middle" fill="#00b4ff" font-family="Arial" font-size="8" opacity="0.6">128 × 64 OLED Stream</text>
<!-- FPS info -->
<text x="180" y="185" fill="#888" font-family="Arial" font-size="9">FPS: <tspan fill="#00b4ff">24</tspan> | Interval: <tspan fill="#00b4ff">100</tspan>ms | Latency: <tspan fill="#00b4ff">12.3</tspan>ms</text>
<!-- Control buttons -->
<text x="250" y="210" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="10">Controls</text>
<rect x="230" y="220" width="40" height="30" fill="#0e5cc2" rx="4"/><text x="250" y="240" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">&#9650;</text>
<rect x="180" y="255" width="40" height="30" fill="#0e5cc2" rx="4"/><text x="200" y="275" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">&#9664;</text>
<rect x="230" y="255" width="40" height="30" fill="#0e5cc2" rx="4"/><text x="250" y="275" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9">OK</text>
<rect x="280" y="255" width="40" height="30" fill="#0e5cc2" rx="4"/><text x="300" y="275" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">&#9658;</text>
<rect x="230" y="290" width="40" height="30" fill="#0e5cc2" rx="4"/><text x="250" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">&#9660;</text>
<!-- Log area -->
<rect x="40" y="220" width="120" height="150" fill="#0d1117" stroke="#333" rx="4"/>
<text x="48" y="235" fill="#7db5ff" font-family="Arial" font-size="8">Log:</text>
<text x="48" y="250" fill="#555" font-family="monospace" font-size="7">[14:30] Connected</text>
<text x="48" y="262" fill="#555" font-family="monospace" font-size="7">[14:30] Frame received</text>
<text x="48" y="274" fill="#555" font-family="monospace" font-size="7">[14:31] Button: UP</text>
<text x="48" y="286" fill="#555" font-family="monospace" font-size="7">[14:31] Menu scrolled</text>
<!-- Back button -->
<rect x="190" y="340" width="120" height="25" fill="#16213e" stroke="#333" rx="4"/><text x="250" y="357" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="9">BACK</text>
</svg>
