<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#1a1a2e" rx="12"/>
<text x="400" y="35" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="20" font-weight="bold">TamsDeauth — System Architecture</text>
<!-- ESP8266 center -->
<rect x="325" y="260" width="150" height="80" fill="#16213e" stroke="#7db5ff" stroke-width="2" rx="8"/>
<text x="400" y="295" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">ESP8266</text>
<text x="400" y="315" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="11">4MB Flash · 80MHz</text>
<!-- Hardware connections -->
<rect x="50" y="120" width="120" height="50" fill="#16213e" stroke="#0e5cc2" rx="6"/>
<text x="110" y="150" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">SSD1306 OLED</text>
<line x1="170" y1="145" x2="325" y2="280" stroke="#0e5cc2" stroke-width="1.5"/>
<rect x="50" y="200" width="120" height="40" fill="#16213e" stroke="#0e5cc2" rx="6"/>
<text x="110" y="225" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">4 Buttons (GPIO)</text>
<line x1="170" y1="220" x2="325" y2="285" stroke="#0e5cc2" stroke-width="1.5"/>
<rect x="50" y="280" width="120" height="40" fill="#16213e" stroke="#0e5cc2" rx="6"/>
<text x="110" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">LED (GPIO2)</text>
<line x1="170" y1="300" x2="325" y2="300" stroke="#0e5cc2" stroke-width="1.5"/>
<rect x="50" y="360" width="120" height="40" fill="#16213e" stroke="#0e5cc2" rx="6"/>
<text x="110" y="385" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">BW16 (5GHz)</text>
<line x1="170" y1="380" x2="325" y2="320" stroke="#0e5cc2" stroke-width="1.5"/>
<!-- Software modules right side -->
<rect x="600" y="120" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="142" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">config.h (EEPROM)</text>
<line x1="600" y1="137" x2="475" y2="275" stroke="#333" stroke-width="1"/>
<rect x="600" y="170" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="192" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">display.h (OLED)</text>
<line x1="600" y1="187" x2="475" y2="285" stroke="#333" stroke-width="1"/>
<rect x="600" y="220" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="242" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">attacks.h (WiFi)</text>
<line x1="600" y1="237" x2="475" y2="295" stroke="#333" stroke-width="1"/>
<rect x="600" y="270" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="292" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">webserver.h (HTTP)</text>
<line x1="600" y1="287" x2="475" y2="300" stroke="#333" stroke-width="1"/>
<rect x="600" y="320" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="342" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">sniffer.h (Promisc)</text>
<line x1="600" y1="337" x2="475" y2="305" stroke="#333" stroke-width="1"/>
<rect x="600" y="370" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="392" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">espnow_ctrl.h</text>
<line x1="600" y1="387" x2="475" y2="310" stroke="#333" stroke-width="1"/>
<rect x="600" y="420" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="442" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">filesystem.h</text>
<line x1="600" y1="437" x2="475" y2="315" stroke="#333" stroke-width="1"/>
<rect x="600" y="470" width="140" height="35" fill="#16213e" stroke="#7db5ff" rx="6"/>
<text x="670" y="492" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="10">localization.h</text>
<line x1="600" y1="487" x2="475" y2="320" stroke="#333" stroke-width="1"/>
<!-- WiFi AP -->
<rect x="325" y="430" width="150" height="50" fill="#16213e" stroke="#00b4ff" rx="6"/>
<text x="400" y="455" text-anchor="middle" fill="#00b4ff" font-family="Arial" font-size="11" font-weight="bold">WiFi AP : TamsDeauth</text>
<text x="400" y="470" text-anchor="middle" fill="#7db5ff" font-family="Arial" font-size="9">192.168.4.1:80</text>
<line x1="400" y1="340" x2="400" y2="430" stroke="#00b4ff" stroke-width="1.5" stroke-dasharray="4"/>
<!-- LittleFS -->
<rect x="325" y="520" width="150" height="40" fill="#16213e" stroke="#0e5cc2" rx="6"/>
<text x="400" y="545" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="11">LittleFS (1MB)</text>
<line x1="400" y1="480" x2="400" y2="520" stroke="#333" stroke-width="1"/>
</svg>
